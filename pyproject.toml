[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "running-coach-app"
version = "0.1.0"
description = "Loopback-only local application server for the privacy-first running coach"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
